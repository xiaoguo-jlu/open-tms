<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open-TMS FX 交易管理(SPOT/FWD/NDF) - 交互原型</title>
<style>
/* ========== Reset & Base ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: #303133;
  background: #f5f7fa;
  min-height: 100vh;
}

/* ========== Layout ========== */
.app-layout {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  width: 220px;
  background: #001529;
  color: #fff;
  flex-shrink: 0;
}
.sidebar-logo {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  font-weight: 600;
  background: rgba(255,255,255,0.05);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sidebar-menu { padding: 12px 0; }
.menu-group { margin-bottom: 8px; }
.menu-group-title {
  padding: 8px 24px;
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.menu-item {
  padding: 10px 24px;
  cursor: pointer;
  color: rgba(255,255,255,0.7);
  border-left: 3px solid transparent;
  transition: all 0.2s;
}
.menu-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.menu-item.active {
  background: #1890ff;
  color: #fff;
  border-left-color: #fff;
}
.menu-item .icon { margin-right: 8px; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.header {
  height: 60px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  box-shadow: 0 1px 4px rgba(0,21,41,.08);
  z-index: 10;
}
.header-title { font-size: 18px; font-weight: 600; }
.header-actions { display: flex; align-items: center; gap: 16px; }
.user-info {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; padding: 4px 12px; border-radius: 4px;
}
.user-info:hover { background: #f5f7fa; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: #1890ff; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 14px;
}
.content { flex: 1; padding: 24px; overflow: auto; }

/* ========== Page Switcher (Demo only) ========== */
.page-switcher {
  position: fixed; top: 70px; right: 24px; z-index: 1000;
  background: #fff; padding: 8px; border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  display: flex; flex-direction: column; gap: 4px;
}
.page-switcher button {
  padding: 6px 12px; border: none; border-radius: 4px;
  background: #f0f0f0; cursor: pointer; font-size: 12px;
  text-align: left; white-space: nowrap;
}
.page-switcher button.active { background: #1890ff; color: #fff; }

/* ========== Card ========== */
.card {
  background: #fff;
  border-radius: 4px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.card-title {
  font-size: 15px; font-weight: 600; margin-bottom: 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.card-title .actions { display: flex; gap: 8px; }

/* ========== Stat Cards ========== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
.stat-card {
  background: #fff;
  border-radius: 4px;
  padding: 18px 20px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.03);
}
.stat-card .label { color: #909399; font-size: 13px; margin-bottom: 6px; }
.stat-card .value { font-size: 24px; font-weight: 600; color: #303133; }
.stat-card .delta { font-size: 12px; color: #67c23a; margin-top: 4px; }
.stat-card .delta.down { color: #f56c6c; }

/* ========== Filter ========== */
.filter-form {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px 16px;
  margin-bottom: 12px;
}
.filter-actions { display: flex; gap: 8px; }

/* ========== Buttons ========== */
.btn {
  display: inline-block;
  padding: 6px 16px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  border: 1px solid transparent;
  background: #fff;
  color: #606266;
  transition: all 0.2s;
  user-select: none;
}
.btn:hover { opacity: 0.85; }
.btn-primary { background: #1890ff; color: #fff; border-color: #1890ff; }
.btn-primary:hover { background: #40a9ff; }
.btn-success { background: #52c41a; color: #fff; border-color: #52c41a; }
.btn-warning { background: #faad14; color: #fff; border-color: #faad14; }
.btn-danger { background: #f5222d; color: #fff; border-color: #f5222d; }
.btn-default { background: #fff; color: #606266; border-color: #d9d9d9; }
.btn-default:hover { color: #1890ff; border-color: #1890ff; }
.btn-text { background: transparent; color: #1890ff; padding: 4px 8px; border: none; }
.btn-text.danger { color: #f5222d; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.btn-link { background: none; border: none; color: #1890ff; padding: 0; cursor: pointer; }
.btn-link:hover { text-decoration: underline; }

/* ========== Tabs ========== */
.tabs {
  display: flex;
  border-bottom: 1px solid #e4e7ed;
  margin-bottom: 20px;
  gap: 0;
}
.tab {
  padding: 10px 20px;
  cursor: pointer;
  color: #606266;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all 0.2s;
  position: relative;
}
.tab:hover { color: #1890ff; }
.tab.active {
  color: #1890ff;
  border-bottom-color: #1890ff;
  font-weight: 500;
}
.tab .badge {
  display: inline-block;
  background: #f0f0f0;
  color: #606266;
  border-radius: 10px;
  padding: 1px 8px;
  font-size: 11px;
  margin-left: 6px;
}
.tab.active .badge { background: #e6f7ff; color: #1890ff; }

/* ========== Table ========== */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td {
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid #ebeef5;
  font-size: 13px;
}
th {
  background: #fafafa;
  color: #606266;
  font-weight: 500;
  white-space: nowrap;
}
tbody tr:hover { background: #f5f7fa; }
.text-right { text-align: right; }
.text-center { text-align: center; }
.text-mono { font-family: "SF Mono", Consolas, monospace; }
.text-success { color: #67c23a; }
.text-danger { color: #f56c6c; }
.text-primary { color: #1890ff; }
.text-warning { color: #faad14; }
.text-muted { color: #909399; font-size: 12px; }

/* ========== Tag / Badge ========== */
.tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 3px;
  font-size: 12px;
  line-height: 20px;
  border: 1px solid;
}
.tag-success { background: #f0f9ff; color: #67c23a; border-color: #b3e19d; }
.tag-primary { background: #e6f7ff; color: #1890ff; border-color: #91d5ff; }
.tag-warning { background: #fffbe6; color: #faad14; border-color: #ffe58f; }
.tag-danger  { background: #fff1f0; color: #f5222d; border-color: #ffa39e; }
.tag-info    { background: #f4f4f5; color: #909399; border-color: #d3d4d6; }

/* ========== Form ========== */
.form-row { display: flex; align-items: center; margin-bottom: 16px; gap: 8px; }
.form-row .label {
  width: 110px;
  text-align: right;
  color: #606266;
  font-size: 13px;
  flex-shrink: 0;
}
.form-row .label.required::before {
  content: '*';
  color: #f5222d;
  margin-right: 4px;
}
.form-input, .form-select {
  flex: 1;
  padding: 6px 12px;
  border: 1px solid #dcdfe6;
  border-radius: 4px;
  font-size: 13px;
  background: #fff;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus { border-color: #1890ff; }
.form-input:disabled, .form-input.readonly { background: #f5f7fa; color: #909399; }
.form-input.text-right { text-align: right; }
.form-row .suffix { color: #909399; font-size: 12px; min-width: 50px; }

/* ========== Drawer ========== */
.drawer-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 999;
  display: none;
  animation: fadeIn 0.2s;
}
.drawer-mask.show { display: block; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: 520px;
  background: #fff;
  z-index: 1000;
  display: flex; flex-direction: column;
  transform: translateX(100%);
  transition: transform 0.3s;
  box-shadow: -2px 0 8px rgba(0,0,0,0.15);
}
.drawer.show { transform: translateX(0); }
.drawer-header {
  height: 56px;
  padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #e4e7ed;
  font-size: 16px; font-weight: 500;
}
.drawer-close {
  cursor: pointer; font-size: 18px; color: #909399;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
}
.drawer-close:hover { background: #f5f7fa; color: #303133; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
.drawer-footer {
  padding: 12px 20px;
  border-top: 1px solid #e4e7ed;
  display: flex; gap: 8px; justify-content: flex-end;
}

/* ========== Dialog ========== */
.dialog-mask {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1001;
  display: none;
  align-items: center; justify-content: center;
}
.dialog-mask.show { display: flex; }
.dialog {
  background: #fff;
  border-radius: 4px;
  width: 480px;
  max-width: 90%;
  max-height: 80vh;
  display: flex; flex-direction: column;
}
.dialog-header {
  padding: 16px 20px;
  border-bottom: 1px solid #e4e7ed;
  font-size: 15px; font-weight: 500;
  display: flex; align-items: center; justify-content: space-between;
}
.dialog-body { padding: 20px; overflow-y: auto; }
.dialog-footer {
  padding: 12px 20px;
  border-top: 1px solid #e4e7ed;
  display: flex; gap: 8px; justify-content: flex-end;
}

/* ========== Info Card (Detail Header) ========== */
.info-card {
  background: linear-gradient(135deg, #f0f5ff 0%, #f9fbff 100%);
  border: 1px solid #d6e4ff;
  border-radius: 6px;
  padding: 20px 24px;
  margin-bottom: 16px;
}
.info-card .title-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.info-card .deal-num {
  font-size: 18px; font-weight: 600; color: #303133;
}
.info-card .deal-meta {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px 24px;
  padding-top: 12px;
  border-top: 1px solid #e8e8e8;
}
.info-card .meta-item .label { font-size: 12px; color: #909399; }
.info-card .meta-item .value { font-size: 14px; color: #303133; margin-top: 4px; font-weight: 500; }

/* ========== Leg (BUY/SELL) ========== */
.leg-block {
  background: #fafbfc;
  border: 1px solid #e4e7ed;
  border-radius: 4px;
  padding: 12px 16px;
  margin-bottom: 8px;
}
.leg-block .leg-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.leg-block .leg-label { font-weight: 500; color: #303133; }
.leg-row { display: flex; gap: 12px; align-items: center; }
.leg-arrow { text-align: center; color: #1890ff; font-size: 18px; margin: 4px 0; }

/* ========== Warning Card (NDF) ========== */
.warning-card {
  background: #fff7e6;
  border: 1px solid #ffd591;
  border-left: 4px solid #fa8c16;
  border-radius: 4px;
  padding: 14px 16px;
  margin: 16px 0;
}
.warning-card .title {
  font-weight: 600; color: #d46b08; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.warning-card ul { margin-left: 20px; color: #874d00; font-size: 13px; line-height: 22px; }

/* ========== Limit Progress ========== */
.limit-progress {
  background: #f6ffed;
  border: 1px solid #b7eb8f;
  border-radius: 4px;
  padding: 12px 16px;
  margin: 8px 0;
}
.limit-progress .progress-row {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; margin-bottom: 6px;
}
.progress-bar {
  width: 100%; height: 6px; background: #f0f0f0; border-radius: 3px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%; background: linear-gradient(90deg, #52c41a, #73d13d);
  transition: width 0.3s;
}

/* ========== Timeline (DealMap) ========== */
.timeline { padding: 0; }
.timeline-item {
  position: relative;
  padding-left: 24px;
  padding-bottom: 24px;
  border-left: 2px solid #e4e7ed;
  margin-left: 8px;
}
.timeline-item:last-child { border-left-color: transparent; padding-bottom: 0; }
.timeline-dot {
  position: absolute; left: -7px; top: 4px;
  width: 12px; height: 12px; border-radius: 50%;
  background: #1890ff; border: 2px solid #fff;
  box-shadow: 0 0 0 2px #e4e7ed;
}
.timeline-dot.success { background: #52c41a; }
.timeline-dot.warning { background: #faad14; }
.timeline-dot.danger { background: #f5222d; }
.timeline-dot.pending { background: #d9d9d9; }
.timeline-content { background: #fafbfc; border-radius: 4px; padding: 12px 16px; }
.timeline-header { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; flex-wrap: wrap; }
.timeline-time { color: #909399; font-size: 12px; font-family: monospace; }
.timeline-event { font-weight: 500; }
.timeline-body { color: #606266; font-size: 13px; line-height: 22px; }
.timeline-body .meta { color: #909399; font-size: 12px; margin-top: 4px; }

/* ========== Voucher (Accounting) ========== */
.voucher-card {
  background: #fff;
  border: 1px solid #e4e7ed;
  border-radius: 4px;
  margin-bottom: 16px;
  overflow: hidden;
}
.voucher-header {
  background: #fafbfc;
  padding: 12px 16px;
  border-bottom: 1px solid #e4e7ed;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
.voucher-header .title { font-weight: 600; color: #303133; }
.voucher-body { padding: 12px 16px; }
.voucher-table { width: 100%; border-collapse: collapse; }
.voucher-table th, .voucher-table td {
  padding: 8px 12px; font-size: 13px;
  border-bottom: 1px solid #ebeef5;
}
.voucher-table th { background: #f5f7fa; color: #606266; font-weight: 500; }
.voucher-table .dr { color: #52c41a; font-weight: 500; }
.voucher-table .cr { color: #f5222d; font-weight: 500; }
.voucher-footer {
  padding: 10px 16px; background: #fafbfc;
  border-top: 1px solid #e4e7ed;
  font-size: 12px; color: #606266;
  display: flex; justify-content: space-between;
}

/* ========== Pagination ========== */
.pagination {
  display: flex; align-items: center; justify-content: flex-end;
  padding: 16px 0; gap: 8px; color: #606266; font-size: 13px;
}
.page-btn {
  min-width: 32px; height: 32px; padding: 0 8px;
  border: 1px solid #d9d9d9; background: #fff;
  border-radius: 4px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.page-btn:hover { color: #1890ff; border-color: #1890ff; }
.page-btn.active { background: #1890ff; color: #fff; border-color: #1890ff; }

/* ========== Misc ========== */
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-8 { gap: 8px; }
.gap-16 { gap: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.divider { height: 1px; background: #e4e7ed; margin: 16px 0; }
.divider-text {
  position: relative; text-align: center; margin: 16px 0;
  color: #909399; font-size: 12px;
}
.divider-text::before, .divider-text::after {
  content: ''; position: absolute; top: 50%;
  width: 40%; height: 1px; background: #e4e7ed;
}
.divider-text::before { left: 0; }
.divider-text::after { right: 0; }
.empty { text-align: center; color: #909399; padding: 40px 0; font-size: 13px; }

/* Animation */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Section title with icon */
.section-title {
  font-size: 14px; font-weight: 600; color: #303133;
  margin-bottom: 12px; padding-left: 8px;
  border-left: 3px solid #1890ff;
}

/* ========== v3.2 Calculate (Backend Integration) ========== */
.calc-panel {
  background: #f0f5ff;
  border: 1px solid #d6e4ff;
  border-radius: 4px;
  padding: 12px 16px;
  margin-bottom: 16px;
}
.calc-panel .calc-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.calc-panel .calc-title { font-weight: 600; color: #303133; font-size: 13px; }
.calc-panel .calc-status { font-size: 12px; color: #909399; display: flex; align-items: center; gap: 6px; }
.calc-panel .calc-status.loading { color: #1890ff; }
.calc-panel .calc-status.success { color: #52c41a; }
.calc-panel .calc-status.error { color: #f5222d; }
.calc-panel .calc-spinner {
  display: inline-block;
  width: 12px; height: 12px;
  border: 2px solid #1890ff;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.calc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px 16px;
}
.calc-grid .calc-item .label { font-size: 12px; color: #909399; }
.calc-grid .calc-item .value {
  font-size: 14px; color: #303133; font-weight: 500;
  font-family: "SF Mono", Consolas, monospace;
  margin-top: 2px;
}
.calc-grid .calc-item .value.muted { color: #909399; font-style: italic; font-family: inherit; font-size: 13px; }

/* Readonly badge (showing backend-computed value) */
.readonly-badge {
  display: inline-block;
  margin-left: 6px;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 11px;
  background: #e6f7ff;
  color: #1890ff;
  border: 1px solid #91d5ff;
  vertical-align: middle;
}

/* ========== v3.2 DealMap Table ========== */
.dealmap-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.dealmap-table thead th {
  background: #fafafa;
  color: #606266;
  font-weight: 500;
  padding: 10px 12px;
  border-bottom: 1px solid #ebeef5;
  white-space: nowrap;
  text-align: left;
}
.dealmap-table tbody td {
  padding: 10px 12px;
  border-bottom: 1px solid #ebeef5;
}
.dealmap-table tbody tr:hover { background: #f5f7fa; }
.dealmap-type {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 12px;
  font-weight: 500;
  font-family: "SF Mono", Consolas, monospace;
}
.dealmap-type-buy  { background: #f0f9ff; color: #67c23a; border: 1px solid #b3e19d; }
.dealmap-type-sell { background: #fff1f0; color: #f5222d; border: 1px solid #ffa39e; }
.dealmap-type-rate { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; }
.dealmap-type-fix  { background: #fff7e6; color: #fa8c16; border: 1px solid #ffd591; }

.cf-link {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 3px;
  background: #e6f7ff;
  color: #1890ff;
  font-family: "SF Mono", Consolas, monospace;
  font-size: 12px;
  cursor: pointer;
}
.cf-link.no-cf { background: #f5f7fa; color: #909399; cursor: default; }

/* v3.2 NDF FX_FIX highlight */
.fix-event-block {
  background: #fff7e6;
  border: 1px solid #ffd591;
  border-radius: 4px;
  padding: 12px 16px;
  margin: 12px 0;
}
.fix-event-block .fix-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.fix-event-block .fix-title { font-weight: 600; color: #d46b08; }
.fix-event-block .fix-amount {
  font-family: "SF Mono", Consolas, monospace;
  font-size: 18px;
  font-weight: 600;
}

</style>
</head>
<body>

<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">💰 Open-TMS 资金管理系统</div>
    <nav class="sidebar-menu">
      <div class="menu-group">
        <div class="menu-group-title">M1 基础数据</div>
        <div class="menu-item"><span class="icon">🌍</span>国家与币种</div>
        <div class="menu-item"><span class="icon">🏦</span>银行账户</div>
        <div class="menu-item"><span class="icon">🤝</span>交易对手</div>

// ========== Table Renderer ==========
function renderTable(product) {
  const allDeals = [
    { num: 'FX202606290001', type: 'SPOT', sell: 'USD 13,750.00', buy: 'CNY 100,000.00', rate: '7.2727', valueDate: '2026-07-01', maturity: '—', status: 'Settled', tagType: 'success' },
    { num: 'FX202606280005', type: 'SPOT', sell: 'USD 50,000.00', buy: 'CNY 363,500.00', rate: '7.2700', valueDate: '2026-06-30', maturity: '—', status: 'Settled', tagType: 'success' },
    { num: 'FX202606280004', type: 'SPOT', sell: 'EUR 20,000.00', buy: 'CNY 158,000.00', rate: '7.9000', valueDate: '2026-06-30', maturity: '—', status: 'Settled', tagType: 'success' },
    { num: 'FX202606280001', type: 'FWD',  sell: 'USD 100,000.00', buy: 'CNY 720,000.00', rate: '7.2000', valueDate: '2026-06-28', maturity: '2026-09-28', status: 'Active', tagType: 'success' },
    { num: 'FX202606270002', type: 'FWD',  sell: 'USD 50,000.00',  buy: 'CNY 360,000.00', rate: '7.2000', valueDate: '2026-06-27', maturity: '2026-09-27', status: 'Active', tagType: 'success' },
    { num: 'FX202606260001', type: 'FWD',  sell: 'EUR 80,000.00',  buy: 'CNY 632,000.00', rate: '7.9000', valueDate: '2026-06-26', maturity: '2026-12-26', status: 'Active', tagType: 'success' },
    { num: 'FX202606250003', type: 'FWD',  sell: 'USD 200,000.00', buy: 'CNY 1,438,000.00', rate: '7.1900', valueDate: '2026-06-25', maturity: '2026-07-25', status: 'Matured', tagType: 'success' },
    { num: 'FX202606270001', type: 'NDF',  sell: 'USD 100,000.00', buy: 'CNY(结算)', rate: '7.1800', valueDate: '2026-06-27', maturity: '2026-09-27', status: 'Active', tagType: 'success' },
  ];
  const deals = product === 'ALL' ? allDeals : allDeals.filter(d => d.type === product);
  const statusLabel = { New: '⚪ 新建', Submitted: '🔵 已提交', Approved: '🟡 已审批', Active: '🟢 活跃', Settled: '✅ 已结算', Matured: '✅ 已到期', NDFSettled: '✅ 差额结算', Rejected: '🔴 已驳回', Canceled: '❌ 已撤销' };

  let html = `<table>
    <thead>
      <tr>
        <th style="width:32px;"><input type="checkbox" /></th>
        <th>交易编号</th><th>类型</th><th>卖出</th><th>买入</th>
        <th>汇率</th><th>起息日</th><th>到期日</th><th>状态</th><th>操作</th>
      </tr>
    </thead>
    <tbody>`;
  for (const d of deals) {
    html += `<tr>
      <td><input type="checkbox" /></td>
      <td><a class="btn-link" href="javascript:;" onclick="showPage('${d.type === 'NDF' ? 'detail-ndf' : 'detail-fwd'}')">${d.num}</a></td>
      <td><span class="tag ${d.type === 'SPOT' ? 'tag-primary' : d.type === 'FWD' ? 'tag-info' : 'tag-warning'}">${d.type === 'SPOT' ? '即期' : d.type === 'FWD' ? '远期' : 'NDF'}</span></td>
      <td>${d.sell}</td><td>${d.buy}</td>
      <td class="text-mono">${d.rate}</td>
      <td>${d.valueDate}</td>
      <td>${d.maturity}</td>
      <td><span class="tag tag-${d.tagType}">${statusLabel[d.status] || d.status}</span></td>
      <td>
        <button class="btn-link" onclick="showPage('${d.type === 'NDF' ? 'detail-ndf' : 'detail-fwd'}')">详情</button>
        <button class="btn-link" style="margin-left:8px;">编辑</button>
        <button class="btn-link" style="margin-left:8px; color:#f5222d;">撤销</button>
      </td>
    </tr>`;
  }
  if (deals.length === 0) {
    html += `<tr><td colspan="10" class="empty">暂无数据</td></tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

// ========== Page Switcher ==========
function showPage(name) {
  const content = document.getElementById('content');
  document.querySelectorAll('.page-switcher button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  content.innerHTML = pages[name]();
}

function switchProduct(p) {
  document.querySelectorAll('#productTabs .tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`#productTabs .tab[data-product="${p}"]`).classList.add('active');
  document.getElementById('dealTable').innerHTML = renderTable(p);
}

function switchDetailTab(t) {
  document.querySelectorAll('#detailTabs .tab').forEach(tab => tab.classList.remove('active'));
  document.querySelector(`#detailTabs .tab[data-detail-tab="${t}"]`).classList.add('active');
  const map = {
    'dealmap': renderDealMapTab,
    'cashflow': () => `<div class="section-title">Cashflow</div>
      <table><thead><tr><th>编号</th><th>关联 DM</th><th>币种</th><th>方向</th><th class="text-right">金额</th><th>起息日</th><th>状态</th></tr></thead>
      <tbody><tr><td colspan="7" class="empty">FWD 签约日无现金流,到期交割时生成 2 条</td></tr></tbody></table>`,

        </div></div>
        <div class="timeline-item"><div class="timeline-dot success"></div><div class="timeline-content">

// ========== Drawer / Dialog ==========
function openDrawer(type) {
  const drawer = document.getElementById('drawer');
  const body = document.getElementById('drawerBody');
  const title = document.getElementById('drawerTitle');
  const map = {
    'SPOT': ['新建即期外汇交易', renderDrawerSpot],
    'FWD':  ['新建远期外汇交易', renderDrawerFwd],
    'NDF':  ['新建 NDF 外汇交易', renderDrawerNdf],
  };
  title.textContent = map[type][0];
  body.innerHTML = map[type][1]();
  document.getElementById('drawerMask').classList.add('show');
  drawer.classList.add('show');
}

function closeDrawer() {
  document.getElementById('drawerMask').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
}

function openDialog(type) {
  const dialog = document.getElementById('dialog');
  const body = document.getElementById('dialogBody');
  const title = document.getElementById('dialogTitle');
  const footer = document.getElementById('dialogFooter');
  const map = {
    'mtm': ['手动触发 MTM 调整', renderMtmDialog, '<button class="btn btn-default" onclick="closeDialog()">取消</button><button class="btn btn-primary" onclick="closeDialog()">确认触发</button>'],
    'approval': ['审批外汇交易', renderApprovalDialog, '<button class="btn btn-default" onclick="closeDialog()">取消</button><button class="btn btn-primary" onclick="closeDialog()">确认提交</button>'],
  };
  title.textContent = map[type][0];
  body.innerHTML = map[type][1]();
  footer.innerHTML = map[type][2];
  document.getElementById('dialogMask').classList.add('show');
}

function closeDialog() {
  document.getElementById('dialogMask').classList.remove('show');
}

// ========== Init ==========
document.getElementById('content').innerHTML = pages['list']();

// Show approval dialog button on detail page
function showApprovalDialog() { openDialog('approval'); }
